name: SSG visual regression

on:
  pull_request:
  push:
    branches: ["perf/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssg-vrt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Auto-imported absolute paths participate in Vue's scope hashes. Build
      # both revisions at this same path, preserving only the frozen reference.
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
          cache: pnpm
      - name: Freeze live build inputs for both revisions
        run: |
          mkdir -p .vrt
          cp tests/vrt/frozen-fetch.mjs .vrt/frozen-fetch.mjs
          node tests/vrt/build-inputs.mjs .vrt/build-inputs.json
      - uses: actions/checkout@v4
        with:
          ref: 9aa603958ed8f1ffde66aa2052d530d3d584c66b
          clean: false
      - run: pnpm install --frozen-lockfile
      - name: Build the unmodified PR 3 reference
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/.vrt/frozen-fetch.mjs
          VRT_BUILD_INPUTS: ${{ github.workspace }}/.vrt/build-inputs.json
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { cp, mkdir, stat, writeFile, readFile } from "node:fs/promises";
          import { createHash } from "node:crypto";
          import { resolve } from "node:path";
          const commit = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          assert.equal(commit, "9aa603958ed8f1ffde66aa2052d530d3d584c66b");
          const startedAt = new Date().toISOString(), started = performance.now();
          execFileSync("pnpm", ["build"], { stdio: "inherit", env: { ...process.env, NODE_ENV: "production", TZ: "Asia/Tokyo" } });
          const seconds = (performance.now() - started) / 1000;
          const { loadPages } = await import("./ssg/routes.mjs");
          const pages = await loadPages();
          for (const page of pages) assert.ok((await stat(".output/public" + page.path + "index.html")).size > 0, page.path);
          assert.ok((await stat(".output/public/404.html")).size > 0);
          const { sourceFingerprint } = await import("./tests/vrt/evidence.mjs");
          const receipt = {
            commit, baselineDirectory: resolve(".vrt/reference"), sourceFingerprint: await sourceFingerprint(),
            node: process.version, intlLocale: Intl.DateTimeFormat().resolvedOptions().locale,
            publicUrls: pages.length, startedAt, finishedAt: new Date().toISOString(), seconds,
            buildInputsSha256: createHash("sha256").update(await readFile(".vrt/build-inputs.json")).digest("hex"),
            policy: "One unmodified full PNPM production build at the same checkout path as the candidate. Both builds replay the same checksummed live HTTP response captured before timing. Installation, input capture, output checks and freezing the reference are outside the timer."
          };
          await mkdir(".vrt", { recursive: true });
          await writeFile(".vrt/reference-build.json", JSON.stringify(receipt, null, 2) + "\n");
          await cp(".output/public", ".vrt/reference/.output/public", { recursive: true });
          console.log(receipt);
          JS
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: false
      - run: pnpm install --frozen-lockfile
      - name: Build and verify the optimized site
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/.vrt/frozen-fetch.mjs
          VRT_BUILD_INPUTS: ${{ github.workspace }}/.vrt/build-inputs.json
        run: |
          pnpm build
          node ssg/verify.mjs
          node tests/vrt/check-output.mjs .vrt/reference/.output/public .output/public
          node --input-type=module <<'JS'
          import { writeFile } from "node:fs/promises";
          import { sourceFingerprint } from "./tests/vrt/evidence.mjs";
          await writeFile(".vrt/candidate-source-fingerprint.txt", await sourceFingerprint());
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vrt-sites
          path: |
            .output/public/
            .vrt/reference/.output/public/
            .vrt/reference-build.json
            .vrt/build-inputs.json
            .vrt/output-parity.json
            .vrt/candidate-source-fingerprint.txt
            assets/data/i18n-members.ts
          include-hidden-files: true
          compression-level: 1
          retention-days: 7

  all-pages:
    needs: build-sites
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
        theme: [light, dark]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: vrt-sites
      - name: Verify capture sources match the built site
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import { sourceFingerprint } from "./tests/vrt/evidence.mjs";
          assert.equal(await sourceFingerprint(), await readFile(".vrt/candidate-source-fingerprint.txt", "utf8"));
          JS
      - name: Compare every assigned URL with exact pixels
        run: >-
          pnpm test:vrt --sample=all --workers=1 --shard=${{ matrix.shard }}/4
          --reference-metadata=.vrt/reference-build.json
          --reference-dir=.vrt/reference/.output/public
          --viewport=${{ matrix.viewport }} --theme=${{ matrix.theme }}
          --output-dir=output/playwright/${{ matrix.viewport }}-${{ matrix.theme }}-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vrt-${{ matrix.viewport }}-${{ matrix.theme }}-${{ matrix.shard }}
          path: output/playwright/
          retention-days: 7

  coverage:
    if: ${{ always() && needs.build-sites.result == 'success' }}
    needs: [build-sites, all-pages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: vrt-*-*-*
          path: .vrt/combined
          merge-multiple: true
      - name: Require all URLs to pass in all four conditions
        run: node tests/vrt/check-results.mjs .vrt/combined 9aa603958ed8f1ffde66aa2052d530d3d584c66b
