name: Deploy

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      build_only:
        description: "Build and measure SSG without deploying"
        type: boolean
        default: false
      compiler_benchmark:
        description: "Compare standard Vue and Vize once each (requires build_only)"
        type: boolean
        default: false

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: "22"

      - name: Require build-only for compiler benchmark
        if: ${{ inputs.compiler_benchmark && !inputs.build_only }}
        run: exit 1

      - name: Install dependencies
        run: pnpm install

      - name: Build website
        if: ${{ !inputs.compiler_benchmark }}
        run: |
          /usr/bin/time -p -o "$RUNNER_TEMP/ssg-time.txt" pnpm generate
          cat "$RUNNER_TEMP/ssg-time.txt"
        env:
          NODE_ENV: production
          CROWDIN_INTG_API: ${{ secrets.CROWDIN_INTG_API }}
          SERVER_LIST_API_BASE_URL: ${{ secrets.SERVER_LIST_API_BASE_URL }}

      - name: Verify full SSG and report timing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_only && !inputs.compiler_benchmark }}
        run: |
          node --experimental-strip-types --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile, stat, appendFile } from 'node:fs/promises';
          import { cpus } from 'node:os';
          import { loadPages } from './ssg/routes.mjs';
          const pages = await loadPages();
          for (const page of pages) {
            assert.ok((await stat('.output/public' + page.path + 'index.html')).size > 0, page.path);
          }
          assert.ok((await stat('.output/public/404.html')).size > 0);
          const manifest = JSON.parse(await readFile('.output/public/.vite/manifest.json', 'utf8'));
          assert.ok(!Object.keys(manifest).some(key => key.endsWith('.md')));
          const timing = await readFile(process.env.RUNNER_TEMP + '/ssg-time.txt', 'utf8');
          const seconds = Number(timing.match(/^real\s+([\d.]+)/m)[1]);
          const result = {
            commit: process.env.GITHUB_SHA,
            publicUrls: pages.length,
            fallback404: true,
            seconds,
            node: process.version,
            cpu: cpus()[0].model,
            cpuCount: cpus().length,
          };
          console.log('[ssg-actions] ' + JSON.stringify(result));
          await appendFile(process.env.GITHUB_STEP_SUMMARY,
            `## Full SSG (single run)\n\n| Item | Result |\n| --- | --- |\n| SSG | ${seconds}s |\n| Public URLs | ${pages.length} + 404 |\n| Node | ${process.version} |\n| CPU | ${result.cpu} (${result.cpuCount} vCPU) |\n`);
          JS

      - name: Compare Vue compilers (single run)
        if: ${{ inputs.compiler_benchmark && inputs.build_only }}
        run: node --experimental-strip-types tooling/vize/actions.mjs
        env:
          NODE_ENV: production
          CROWDIN_INTG_API: ${{ secrets.CROWDIN_INTG_API }}
          SERVER_LIST_API_BASE_URL: ${{ secrets.SERVER_LIST_API_BASE_URL }}

      - name: Upload compiler measurements
        if: ${{ inputs.compiler_benchmark && inputs.build_only }}
        uses: actions/upload-artifact@v4
        with:
          name: compiler-benchmark
          path: .vrt/vize-actions/
          include-hidden-files: true

      # - name: Upload with ftp
      #   uses: SamKirkland/FTP-Deploy-Action@v4.3.6
      #   with:
      #     server: ${{ secrets.FTP_SERVER }}
      #     username: ${{ secrets.FTP_USERNAME }}
      #     password: ${{ secrets.FTP_PASSWORD }}
      #     local-dir: ./.output/public/
      #     server-dir: ${{ secrets.FTP_SERVER_DIR }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./.output/public/

  # Deploy job
  deploy:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_only }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Purge Cloudflare Cache
  purge-cache:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Purge Cloudflare Cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
          -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          --data '{"hosts":["misskey-hub.net"]}'
        continue-on-error: true
