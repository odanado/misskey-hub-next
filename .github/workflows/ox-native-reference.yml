name: Ox native SSG reference

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/ssg/ox-native/**'
      - 'experiments/ssg/shared/**'
      - 'experiments/ssg/results/public-url-count.json'
      - 'content/**'
      - 'pages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ox-native-reference.yml'
  pull_request:
    paths:
      - 'experiments/ssg/ox-native/**'
      - 'experiments/ssg/shared/**'
      - 'experiments/ssg/results/public-url-count.json'
      - 'content/**'
      - 'pages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ox-native-reference.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-ssg:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      # This sample uses published native binaries. Nuxt prepare, browser
      # downloads, and native dependency install scripts are unnecessary.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test experiments/ssg/ox-native/sources.test.mjs
      - run: pnpm pilot:ox-native:build
      - run: HUB_PILOT_PAGES=30 pnpm pilot:ox-native:build
      - run: HUB_PILOT_PAGES=all pnpm pilot:ox-native:measure --runs=3
      - name: Upload native SSG measurements and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ox-native-reference
          include-hidden-files: true
          retention-days: 7
          path: |
            .pilot/**/ox-native-theme/build.json
            .pilot/**/ox-native-theme/timings.json
            .pilot/**/ox-native-theme/run-*.log
